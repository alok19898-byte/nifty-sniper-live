<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chain Speed Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --highlight-color: #facc15; /* Yellow for Highest */
            --speed-up: #22c55e; /* Green for fast growth */
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h2 { text-align: center; color: #38bdf8; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1e293b;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        th { background-color: #334155; color: #94a3b8; }

        /* Highlighting Classes */
        .highest {
            background-color: var(--highlight-color) !important;
            color: #000 !important;
            font-weight: bold;
        }

        .speed-indicator {
            font-size: 11px;
            display: block;
            color: var(--speed-up);
        }

        .strike-price {
            background-color: #000;
            font-weight: bold;
            color: #fbbf24;
        }
    </style>
</head>
