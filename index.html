
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Nifty Monitor</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --atm-line: #58a6ff; --speed-bg: #21262d; --speed-fill: #238636;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 10px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: center; font-size: 12px; }
        .strike { background: #000; color: #ffd33d; font-weight: bold; width: 80px; }
        
        /* ATM Line Style */
        .market-line-row td {
            background: var(--atm-line) !important;
            height: 4px;
            padding: 0;
            border: none;
        }

        /* Speed Progress Bar */
        .speed-container {
            background: var(--speed-bg);
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }
        .speed-bar {
            height: 100%;
            background: var(--speed-fill);
            transition: width 0.5s ease;
        }
        .speed-text { font-size: 10px; font-weight: bold; }
        
        .header-price { font-size: 20px; color: #ffd33d; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header-price">Nifty Live: <span id="niftyPrice">24125</span></div>

    <table>
        <thead>
            <tr style="background:#21262d">
                <th>Speed Score</th>
                <th>Vol (Call)</th>
                <th class="strike">STRIKE</th>
                <th>Vol (Put)</th>
                <th>Speed Score</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let strikes = [23900, 23950, 24000, 24050, 24100, 24150, 24200, 24250, 24300, 24350];
        let marketPrice = 24125;
        let maxTargetSpeed = 2000; // Isse 100% mana jayega

        let data = strikes.map(s => ({
            strike: s,
            cVol: 50000, pVol: 50000,
            cPrevVol: 50000, pPrevVol: 50000
        }));

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            document.getElementById('niftyPrice').innerText = marketPrice;

            data.forEach((row, i) => {
                // Calculation for Speed %
                let cSpeed = row.cVol - row.cPrevVol;
                let pSpeed = row.pVol - row.pPrevVol;
                let cPercent = Math.min((cSpeed / maxTargetSpeed) * 100, 100).toFixed(0);
                let pPercent = Math.min((pSpeed / maxTargetSpeed) * 100, 100).toFixed(0);

                // Check for ATM Line position
                if (i > 0 && marketPrice > strikes[i-1] && marketPrice <= strikes[i]) {
                    let lineRow = <tr class="market-line-row"><td colspan="5"></td></tr>;
                    tbody.innerHTML += lineRow;
                }

                let tr = `
                    <tr>
                        <td>
                            <div class="speed-text">${cPercent}%</div>
                            <div class="speed-container"><div class="speed-bar" style="width:${cPercent}%"></div></div>
                        </td>
                        <td>${row.cVol} <br><small>+${cSpeed}</small></td>
                        <td class="strike">${row.strike}</td>
                        <td>${row.pVol} <br><small>+${pSpeed}</small></td>
                        <td>
                            <div class="speed-text">${pPercent}%</div>
                            <div class="speed-container"><div class="speed-bar" style="width:${pPercent}%"></div></div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
        }
