
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Volume Decoder</title>
    <style>
        body { font-family: sans-serif; display: flex; background: #f4f4f4; padding: 10px; }
        #main-chain { flex: 3; background: white; padding: 15px; border-radius: 8px; }
        #side-tracker { flex: 1; margin-left: 15px; background: #2c3e50; color: white; padding: 15px; border-radius: 8px; position: sticky; top: 10px; height: fit-content; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; }
        th { background: #34495e; color: white; }
        .highlight-vol { background-color: #3498db; color: white; font-weight: bold; } /* Dark Blue */
        .highlight-oi { background-color: #f1c40f; color: black; font-weight: bold; }  /* Gold */
    </style>
</head>
<body>

    <!-- मेन ऑप्शन चेन -->
    <div id="main-chain">
        <h2>Ultimate Volume Decoder</h2>
        <table>
            <thead>
                <tr>
                    <th>CE Vol</th><th>CE %</th><th>CE OI</th><th>CE LTP</th><th>Strike</th><th>PE LTP</th><th>PE OI</th><th>PE %</th><th>PE Vol</th>
                </tr>
            </thead>
            <tbody id="chain-body">
                <!-- यहाँ डेटा लूप में आएगा, अभी ये सैंपल रो है -->
                <tr onclick="trackStrike(23500, 'CE')">
                    <td>45L</td><td class="highlight-vol">100%</td><td>3.2L</td><td>₹60</td><td><b>23500</b></td><td>₹110</td><td>1.8L</td><td>40%</td><td>18L</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- राइट साइड ट्रैकर -->
    <div id="side-tracker">
        <h3>🎯 Selected Strike</h3>
        <div id="tracker-content">Select a strike to see 5-min history...</div>
    </div>

    <script>
        function trackStrike(strike, type) {
            document.getElementById('tracker-content').innerHTML = `
                <p><b>Target: ${strike} ${type}</b></p>
                <p>09:15-09:20 ➔ 45k</p>
                <p>09:20-09:25 ➔ 55k <small>(📈 Increasing)</small></p>
                <p>09:25-09:30 ➔ 30k <small>(📉 Drying Up)</small></p>
            `;
        }
    </script>
</body>
</html>
