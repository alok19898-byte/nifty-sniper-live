<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0e11; color: #fff; font-size: 13px; }
        .container-fluid { width: 98%; }
        .greek-col { display: none; } /* Default hide */
        .show-greeks .greek-col { display: table-cell; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: center; border: 1px solid #363c4e; }
        #sidebar { position: fixed; right: 0; top: 0; width: 300px; height: 100vh; background: #161a1e; border-left: 2px solid #58a6ff; padding: 20px; }
    </style>
</head>
<body class="show-greeks"> <!-- Class toggle se hide/show hoga -->
    <div class="container-fluid">
        <h4 class="text-center my-3">Nifty Sniper Pro Terminal 🎯</h4>
        
        <!-- Control Panel -->
        <div class="d-flex justify-content-center gap-3 mb-3">
            <button class="btn btn-sm btn-outline-primary" onclick="document.body.classList.toggle('show-greeks')">Toggle Greeks</button>
            <button class="btn btn-sm btn-success" onclick="fetch('/start-recording')">▶️ Play History</button>
            <button class="btn btn-sm btn-danger" onclick="fetch('/stop-recording')">⏸️ Pause History</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="greek-col">Delta</th><th class="greek-col">Theta</th><th>OI</th><th>Vol</th><th>LTP</th>
                    <th class="bg-warning text-dark">STRIKE</th>
                    <th>LTP</th><th>Vol</th><th>OI</th><th class="greek-col">Theta</th><th class="greek-col">Delta</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div id="sidebar">
        <h5>🎯 Analysis Panel</h5>
        <div id="hist-data">Click a Strike to view 5m History...</div>
    </div>

    <script>
        // 10 Strike rows generate karna
        let html = "";
        for(let s=23400; s<=23850; s+=50) {
            html += `<tr onclick="document.getElementById('hist-data').innerText='History for ${s} loaded...'">
                <td class="greek-col">0.5</td><td class="greek-col">-10</td><td>1L</td><td>40L</td><td>120</td>
                <td class="fw-bold text-warning">${s}</td>
                <td>80</td><td>35L</td><td>1.5L</td><td class="greek-col">-9</td><td class="greek-col">-0.5</td>
            </tr>`;
        }
        document.getElementById('table-body').innerHTML = html;
    </script>
</body>
</html>
