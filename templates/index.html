<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Dashboard</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; font-size: 12px; }
        th, td { border: 1px solid #000; padding: 8px; }
        .header-row { background-color: #f2f2f2; }
        .toggle-btn { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Nifty Option Chain</h2>
    <button class="toggle-btn" onclick="switchMode('live')">Live</button>
    <button class="toggle-btn" onclick="switchMode('historical')">Historical</button>

    <table>
        <!-- Table Header based on "1000026899.jpg" -->
        <tr class="header-row">
            <th colspan="7">Call Side</th>
            <th>Strike Price</th>
            <th colspan="7">Put Side</th>
        </tr>
        <tr class="header-row">
            <!-- Call Side Columns -->
            <th>IV</th><th>Vega</th><th>Theta</th><th>Gamma</th><th>D</th><th>OI</th><th>LTP</th>
            <!-- Center -->
            <th>Spot Price</th>
            <!-- Put Side Columns -->
            <th>LTP</th><th>OI</th><th>OI Chg</th><th>P</th><th>Gamma</th><th>Theta</th><th>Vega/IV</th>
        </tr>
        <tbody id="dataBody">
            <!-- Data will appear here -->
        </tbody>
    </table>

    <script>
        function switchMode(mode) {
            console.log("Switching to: " + mode);
            // यहाँ आपका API कॉल वाला लॉजिक आएगा
            alert("Mode switched to: " + mode);
        }
    </script>
</body>
</html>
