<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Sniper Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 10px; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: white; padding: 10px; border: 1px solid #ccc; font-size: 14px; }
        .btn { padding: 6px 12px; border: 1px solid #555; background: white; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #eee; }
        .status-bar { background: #e2e2e2; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; border: 1px solid #ccc; font-weight: bold; color: #333; }
        
        table { width: 100%; border-collapse: collapse; text-align: center; background: white; font-size: 13px; }
        th, td { border: 1px solid #aaa; padding: 6px; }
        th { background: #d4d4d4; }
        
        /* Table Colors */
        .itm-call { background-color: #fcebc7; }
        .itm-put { background-color: #d1ecf1; }
        .atm { background-color: #ffcc00; font-weight: bold; }
        
        /* Percentage Styling */
        .pct-normal { display: block; font-size: 11px; color: #444; margin-top: 2px; }
        .pct-100 { display: block; font-size: 12px; color: red; font-weight: bold; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="btn"><option>NIFTY 50</option></select>
        <button class="btn" style="color:red; font-weight:bold;">● Live</button>
        <button class="btn btn-historical">Historical</button>
        <button class="btn btn-greeks">Toggle Greeks ▾</button>
        <button class="btn">⚙️ Settings ▾</button>
    </div>

    <div class="status-bar">
        Live Time: <span id="live-time" style="color: #d10000;">Loading...</span>
    </div>

    <table>
        <thead>
            <tr>
                <th colspan="4">Call Side</th>
                <th>Strike Price</th>
                <th colspan="4">Put Side</th>
            </tr>
            <tr>
                <th>OI Chg</th><th>OI</th><th>Volume</th><th>LTP</th>
                <th>Spot Price</th>
                <th>LTP</th><th>Volume</th><th>OI</th><th>OI Chg</th>
            </tr>
        </thead>
        <tbody id="data-body">
            <!-- 20 rows data will generate here automatically -->
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Live Time Logic (हर 1 सेकंड में अपडेट)
            setInterval(() => {
                let now = new Date();
                document.getElementById('live-time').innerText = now.toLocaleTimeString('en-IN');
            }, 1000);

            // 2. Generate 20 Rows Mock Data (NIFTY 50 style)
            const tbody = document.getElementById('data-body');
            let startStrike = 22800; // Starting point

            for(let i = 0; i < 20; i++) {
                let strike = startStrike + (i * 50);
                let isATM = (strike === 23300);
                let callClass = strike < 23300 ? "itm-call" : "";
                let putClass = strike > 23300 ? "itm-put" : "";
                let strikeHtml = isATM ? <td class="atm">${strike} (ATM)</td> : <td style="font-weight:bold; background:#f8f9fa;">${strike}</td>;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="${callClass} c-oichg">${Math.floor(Math.random()*15000) - 3000}</td>
                    <td class="${callClass} c-oi">${Math.floor(Math.random()*150000)}</td>
                    <td class="${callClass} c-vol">${Math.floor(Math.random()*80000)}</td>
                    <td class="${callClass}">${(Math.random()*150).toFixed(2)}</td>
                    ${strikeHtml}
                    <td class="${putClass}">${(Math.random()*150).toFixed(2)}</td>
                    <td class="${putClass} p-vol">${Math.floor(Math.random()*80000)}</td>
                    <td class="${putClass} p-oi">${Math.floor(Math.random()*150000)}</td>
                    <td class="${putClass} p-oichg">${Math.floor(Math.random()*15000) - 3000}</td>
                `;
                tbody.appendChild(tr);
            }

            // 3. 100% Percentage Logic (Highest value ko 100% karke compare karna)
            function applyPercentages(columnClass) {
                let cells = document.querySelectorAll('.' + columnClass);
                let maxVal = 0;

                // Step A: Find Maximum Absolute Value
                cells.forEach(cell => {
                    let val = Math.abs(parseInt(cell.innerText));
                    if (val > maxVal) { maxVal = val; }
                });

                // Step B: Calculate and Append Percentage
                if (maxVal > 0) {
                    cells.forEach(cell => {
                        let originalText = cell.innerText;
                        let val = Math.abs(parseInt(originalText));
                        let pct = Math.round((val / maxVal) * 100);
                        
                        // Agar 100% hai toh red aur bold dikhega, warna normal
                        let spanClass = (pct === 100) ? 'pct-100' : 'pct-normal';
                        cell.innerHTML = ${originalText} <span class="${spanClass}">(${pct}%)</span>;
                    });
                }
            }

            // Data load hone ke theek baad percentages apply karein
            setTimeout(() => {
                applyPercentages('c-oichg');
                applyPercentages('c-oi');
                applyPercentages('c-vol');
                applyPercentages('p-vol');
                applyPercentages('p-oi');
                applyPercentages('p-oichg');
            }, 100);

            // 4. Buttons Reactivity (Jab click karo to chale)
            document.querySelector('.btn-historical').addEventListener('click', function() {
                alert('Historical Mode: Data fetch setup pending...');
            });
            
            document.querySelector('.btn-greeks').addEventListener('click', function() {
                alert('Greeks View: Delta, Gamma, Theta, IV calculation aayegi yahan...');
            });
        });
    </script>
</body>
</html>
