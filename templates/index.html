<style>

.highest{
background:#ffe066 !important;
font-weight:bold;
border-radius:4px;
padding:2px;
}

.percent{
display:block;
font-size:12px;
color:red;
font-weight:bold;
}

</style>

<script>

function calculateVolumePercent(data){

const maxCall=Math.max(
...data.map(r=>Number(r.callVolume||0))
);

const maxPut=Math.max(
...data.map(r=>Number(r=>r.putVolume||0))
);

return data.map(r=>({
...r,

callPercent:
maxCall>0
?((r.callVolume/maxCall)*100).toFixed(0)
:0,

putPercent:
maxPut>0
?((r.putVolume/maxPut)*100).toFixed(0)
:0

}));

}


function renderTable(data){

data=calculateVolumePercent(data);

let html="";

data.forEach(row=>{

html+=`
<tr>

<td class="${
row.callPercent==100
?'highest':''
}">
${row.callVolume}
<span class="percent">
${row.callPercent}%
</span>
</td>

<td>
${row.strikePrice}
</td>

<td class="${
row.putPercent==100
?'highest':''
}">
${row.putVolume}
<span class="percent">
${row.putPercent}%
</span>
</td>

</tr>
`;

});

document.getElementById("tableBody").innerHTML=html;

}

</script>


<table border="1">

<thead>
<tr>
<th>Call Volume</th>
<th>Strike</th>
<th>Put Volume</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>
