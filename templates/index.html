<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Dashboard Pro</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; background: #f4f4f4; margin: 0; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; margin-top: 10px; background: white; }
        th, td { border: 1px solid #a0a0a0; padding: 6px; }
        .header-main { background-color: #d4d4d4; font-weight: bold; }
        .header-sub { background-color: #ebebeb; font-weight: bold; }
        
        /* Control Panel Styles */
        .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .btn { padding: 8px 15px; cursor: pointer; border: 1px solid #555; background: #fff; border-radius: 4px; font-weight: bold; transition: 0.2s;}
        .btn:hover { background: #e0e0e0; }
        .dropdown { padding: 8px; border-radius: 4px; font-weight: bold; border: 1px solid #555; cursor: pointer; }
        
        /* Play/Pause Button */
        #playBtn { display: none; background-color: #28a745; color: white; border: none; }
        #playBtn:hover { background-color: #218838; }
        #playBtn.paused { background-color: #dc3545; }
        #playBtn.paused:hover { background-color: #c82333; }
        
        /* Live / Historical Buttons Active State */
        .active-mode { box-shadow: inset 0 0 5px rgba(0,0,0,0.3); background-color: #e2e3e5; border-color: #000; }

        /* Live Info Bar */
        .info-bar { 
            display: flex; justify-content: space-between; background: #e9ecef; 
            padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; 
            border: 1px solid #ccc; font-size: 14px;
        }
        .time-text { font-weight: bold; color: #d10000; }
        .price-text { font-weight: bold; color: #0056b3; }

        /* Greeks Dropdown Menu */
        .dropdown-check-list { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #fff; min-width: 150px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 10; border: 1px solid #555; border-radius: 4px; margin-top: 5px; }
        .dropdown-content label { display: block; padding: 10px; cursor: pointer; font-size: 14px; text-align: left; border-bottom: 1px solid #eee;}
        .dropdown-content label:hover { background-color: #f1f1f1; }
        .dropdown-content label:last-child { border-bottom: none; }
        .show-menu { display: block; }

        /* Colors & Highlights */
        .itm-call { background-color: #fff4cc; } 
        .itm-put { background-color: #dcf2f5; }  
        .strike-col { background-color: #f8f9fa; font-weight: bold; font-size: 14px; }
        .pct-box { display: block; font-size: 11px; margin-top: 2px; color: #555; font-weight: normal; }
        .pct-100 { color: #d10000; font-weight: bold; }
        .max-highlight { font-weight: 900 !important; color: #d10000 !important; }
        
        /* Class to Hide Columns */
        .hidden-col { display: none !important; }
    </style>
</head>
<body>

    <!-- Controls Panel -->
    <div class="controls">
        <select class="dropdown" id="indexSelect">
            <option value="NIFTY">NIFTY 50</option>
            <option value="BANKNIFTY">BANKNIFTY</option>
        </select>
        
        <!-- Mode Buttons -->
        <button class="btn active-mode" id="liveBtn" onclick="switchMode('live')">🔴 Live Mode</button>
        <button class="btn" id="histBtn" onclick="switchMode('historical')">📜 Historical Mode</button>
        
        <!-- PLAY BUTTON & SPEED (Hidden by default, shows on Historical) -->
        <button class="btn" id="playBtn" onclick="togglePlay()">▶️ Play</button>
        <select class="dropdown" id="speedControl" style="display: none;">
            <option value="1">⏩ 1 Min / sec</option>
            <option value="2">⏩ 2 Min / sec</option>
            <option value="3">⏩ 3 Min / sec</option>
            <option value="5">⏩ 5 Min / sec</option>
        </select>
        
        <!-- Greeks Menu -->
        <div class="dropdown-check-list">
            <button class="btn dropdown-btn" onclick="toggleMenu('greeksList')">📊 Toggle Greeks ▾</button>
            <div id="greeksList" class="dropdown-content">
                <label><input type="checkbox" class="greek-chk" id="chk-iv" onchange="toggleCol('iv')"> IV</label>
                <label><input type="checkbox" class="greek-chk" id="chk-delta" onchange="toggleCol('delta')"> Delta (Δ)</label>
                <label><input type="checkbox" class="greek-chk" id="chk-theta" onchange="toggleCol('theta')"> Theta (Θ)</label>
                <label><input type="checkbox" class="greek-chk" id="chk-gamma" onchange="toggleCol('gamma')"> Gamma (Γ)</label>
                <label><input type="checkbox" class="greek-chk" id="chk-vega" onchange="toggleCol('vega')"> Vega (V)</label>
            </div>
        </div>
    </div>

    <!-- Live/Historical Info Bar -->
    <div class="info-bar">
        <span class="time-text" id="liveTime">Live Time: Loading...</span>
        <span class="price-text">Spot Price: <span id="spotPriceVal">23,300.00</span></span>
    </div>

    <!-- Options Chain Table -->
    <table id="optionTable">
        <thead>
            <tr class="header-main">
                <th id="callHeader" colspan="4">Call Side</th>
                <th>Strike Price</th>
                <th id="putHeader" colspan="4">Put Side</th>
            </tr>
            <tr class="header-sub" id="subHeader">
                <!-- Greeks Call Side -->
                <th class="col-iv hidden-col">IV</th>
                <th class="col-delta hidden-col">Delta</th>
                <th class="col-theta hidden-col">Theta</th>
                <th class="col-gamma hidden-col">Gamma</th>
                <th class="col-vega hidden-col">Vega</th>
                
                <!-- Main Data Call -->
                <th>OI Chg</th><th>OI</th><th>Volume</th><th>LTP</th>
                
                <th>Spot Price</th>
                
                <!-- Main Data Put -->
                <th>LTP</th><th>Volume</th><th>OI</th><th>OI Chg</th>
                
                <!-- Greeks Put Side -->
                <th class="col-vega hidden-col">Vega</th>
                <th class="col-gamma hidden-col">Gamma</th>
                <th class="col-theta hidden-col">Theta</th>
                <th class="col-delta hidden-col">Delta</th>
                <th class="col-iv hidden-col">IV</th>
            </tr>
        </thead>
        <tbody id="dataBody">
            <!-- Data is injected here by JavaScript -->
        </tbody>
    </table>

    <script>
        // -------------------------
        // 1. GENERATE ROWS & GREEKS DATA
        // -------------------------
        function generateRows() {
            const tbody = document.getElementById("dataBody");
            tbody.innerHTML = ""; 
            let baseStrike = 22800; 
            
            for(let i=0; i<20; i++) {
                let strike = baseStrike + (i*50);
                let isATM = (strike === 23300);
                let callCls = strike < 23300 ? "itm-call" : "";
                let putCls = strike > 23300 ? "itm-put" : "";
                let strikeHtml = isATM ? <td class="strike-col" style="background-color: #ffcc00;">${strike} (ATM)</td> : <td class="strike-col">${strike}</td>;

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="col-iv hidden-col ${callCls}">12.5</td>
                    <td class="col-delta hidden-col ${callCls}">0.85</td>
                    <td class="col-theta hidden-col ${callCls}">-2.1</td>
                    <td class="col-gamma hidden-col ${callCls}">0.02</td>
                    <td class="col-vega hidden-col ${callCls}">9.2</td>

                    <td class="${callCls} val-call-oichg">${Math.floor(Math.random()*15000) - 3000}</td>
                    <td class="${callCls} val-call-oi">${Math.floor(Math.random()*150000)}</td>
                    <td class="${callCls} val-call-vol">${Math.floor(Math.random()*80000)}</td>
                    <td class="${callCls} ltp">${(Math.random()*250).toFixed(2)}</td>

                    ${strikeHtml}

                    <td class="${putCls} ltp">${(Math.random()*250).toFixed(2)}</td>
                    <td class="${putCls} val-put-vol">${Math.floor(Math.random()*80000)}</td>
                    <td class="${putCls} val-put-oi">${Math.floor(Math.random()*150000)}</td>
                    <td class="${putCls} val-put-oichg">${Math.floor(Math.random()*15000) - 3000}</td>

                    <td class="col-vega hidden-col ${putCls}">8.1</td>
                    <td class="col-gamma hidden-col ${putCls}">0.02</td>
                    <td class="col-theta hidden-col ${putCls}">-1.2</td>
                    <td class="col-delta hidden-col ${putCls}">-0.15</td>
                    <td class="col-iv hidden-col ${putCls}">13.1</td>
                `;
                tbody.appendChild(tr);
            }
        }

        // -------------------------
        // 2. 100% PERCENTAGE LOGIC
        // -------------------------
        function applyPercentages() {
            const columns = ['val-call-oi', 'val-call-vol', 'val-call-oichg', 'val-put-oi', 'val-put-vol', 'val-put-oichg'];
            
            columns.forEach(cls => {
                let cells = document.querySelectorAll('.' + cls);
                let maxVal = 0;
                
                cells.forEach(cell => {
                    cell.classList.remove('max-highlight');
                    let text = cell.innerText.split('\n')[0].replace(/,/g, '').trim();
                    let val = Math.abs(parseFloat(text));
                    if (!isNaN(val) && val > maxVal) { maxVal = val; }
                });
                
                if (maxVal > 0) {
                    cells.forEach(cell => {
                        let originalNumber = cell.innerText.split('\n')[0].trim();
                        let val = Math.abs(parseFloat(originalNumber.replace(/,/g, '')));
                        
                        if (!isNaN(val)) {
                            let pct = Math.round((val / maxVal) * 100);
                            if (pct === 100) {
                                cell.classList.add('max-highlight');
                                cell.innerHTML = ${originalNumber} <br><span class="pct-box pct-100">(100%)</span>;
                            } else {
                                cell.innerHTML = ${originalNumber} <br><span class="pct-box">(${pct}%)</span>;
                            }
                        }
                    });
                }
            });
        }

        // -------------------------
        // 3. GREEKS ADD / REMOVE LOGIC
        // -------------------------
        function toggleMenu(menuId) { 
            document.getElementById(menuId).classList.toggle("show-menu"); 
        }

        // Click outside closes the dropdown menu
        window.onclick = function(e) {
            if (!e.target.matches('.dropdown-btn') && !e.target.closest('.dropdown-check-list')) {
                let dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) dropdowns[i].classList.remove('show-menu');
            }
        }

        function toggleCol(greekName) {
            // Check if that specific greek is ticked or not
            let isChecked = document.getElementById('chk-' + greekName).checked;
            let cols = document.querySelectorAll('.col-' + greekName);
            
            cols.forEach(col => {
                if(isChecked) {
                    col.classList.remove('hidden-col'); // Add to table
                } else {
                    col.classList.add('hidden-col'); // Remove from table
                }
            });

            // Count how many greeks are active to expand the top header Call/Put span
            let activeGreeks = document.querySelectorAll('.greek-chk:checked').length;
            document.getElementById("callHeader").colSpan = 4 + activeGreeks;
            document.getElementById("putHeader").colSpan = 4 + activeGreeks;
        }

        // -------------------------
        // 4. LIVE & HISTORICAL LOGIC
        // -------------------------
        let liveTimerInterval;
        let playbackInterval;
        let isPlaying = false;
        let histTime = new Date();
        histTime.setHours(9, 15, 0); // Open at 9:15 AM

        function startLiveTime() {
            clearInterval(playbackInterval);
            liveTimerInterval = setInterval(() => {
                const now = new Date();
                document.getElementById('liveTime').innerText = "Live Time: " + now.toLocaleTimeString('en-IN', { hour12: true });
            }, 1000);
        }

        function switchMode(mode) {
            let speedCtrl = document.getElementById("speedControl");
            let playBtn = document.getElementById("playBtn");
            let timeText = document.getElementById("liveTime");
            let liveBtn = document.getElementById("liveBtn");
            let histBtn = document.getElementById("histBtn");

            if (mode === 'historical') {
                // Turn OFF Live, Turn ON Historical
                clearInterval(liveTimerInterval);
                histBtn.classList.add('active-mode');
                liveBtn.classList.remove('active-mode');
                
                // Show Play & Speed
                speedCtrl.style.display = "inline-block";
                playBtn.style.display = "inline-block";
                
                timeText.innerText = "Historical Time: " + histTime.toLocaleTimeString('en-IN', { hour12: true });
                timeText.style.color = "#ff8c00"; 
            } else {
                // Turn OFF Historical, Turn ON Live
                clearInterval(playbackInterval);
                isPlaying = false;
                playBtn.classList.remove('paused');
                playBtn.innerText = "▶️ Play";
                
                liveBtn.classList.add('active-mode');
                histBtn.classList.remove('active-mode');
                
                // Hide Play & Speed
                speedCtrl.style.display = "none";
                playBtn.style.display = "none";
                
                timeText.style.color = "#d10000";
                startLiveTime();
            }
        }

        function togglePlay() {
            let playBtn = document.getElementById("playBtn");
            if (isPlaying) {
                // PAUSE
                clearInterval(playbackInterval);
                isPlaying = false;
                playBtn.innerText = "▶️ Play";
                playBtn.classList.remove('paused');
            } else {
                // PLAY
                isPlaying = true;
                playBtn.innerText = "⏸️ Pause";
                playBtn.classList.add('paused');
                
                let speed = parseInt(document.getElementById("speedControl").value);
                
                playbackInterval = setInterval(() => {
                    histTime.setMinutes(histTime.getMinutes() + speed);
                    document.getElementById('liveTime').innerText = "Historical Time: " + histTime.toLocaleTimeString('en-IN', { hour12: true });
                    
                    simulateDataMovement(); 
                    applyPercentages();     
                }, 1000);
            }
        }

        function simulateDataMovement() {
            const cols = ['.val-call-oi', '.val-call-vol', '.val-call-oichg', '.val-put-oi', '.val-put-vol', '.val-put-oichg', '.ltp'];
            cols.forEach(cls => {
                document.querySelectorAll(cls).forEach(cell => {
                    let currentNum = parseFloat(cell.innerText.split('\n')[0].replace(/,/g, '').trim());
                    if (!isNaN(currentNum)) {
                        let fluctuation = currentNum * (Math.random() * 0.16 - 0.08);
                        let newVal = Math.round(currentNum + fluctuation);
                        if(cls !== '.val-call-oichg' && cls !== '.val-put-oichg' && newVal < 0) newVal = 100;
                        cell.innerHTML = newVal;
                    }
                });
            });
        }

        // Initialize Everything on First Load
        document.addEventListener("DOMContentLoaded", () => {
            generateRows();
            applyPercentages();
            startLiveTime();
        });
    </script>
</body>
</html>
