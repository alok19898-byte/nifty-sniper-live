<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; margin-top: 10px; }
        th, td { border: 1px solid #a0a0a0; padding: 6px; }
        .header-main { background-color: #d4d4d4; font-weight: bold; }
        .itm-call { background-color: #fff4cc; }
        .itm-put { background-color: #dcf2f5; }
        .strike-col { background-color: #f8f9fa; font-weight: bold; }
        .controls { margin-bottom: 10px; }
        .btn { padding: 8px 15px; cursor: pointer; border: 1px solid #555; background: #fff; }
        /* Percentage style - Ye tere design ko change nahi karega */
        .pct { display: block; font-size: 10px; color: #d10000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn">Historical</button>
        <button class="btn">Toggle Greeks ▾</button>
        <button class="btn">Settings ▾</button>
    </div>

    <table id="data-table">
        <tr class="header-main">
            <th colspan="4">Call Side</th><th>Strike Price</th><th colspan="3">Put Side</th>
        </tr>
        <tr>
            <th>OI Chg</th><th>OI</th><th>Volume</th><th>LTP</th><th>Spot</th>
            <th>LTP</th><th>Volume</th><th>OI</th>
        </tr>
        <!-- 20 rows data -->
        <script>
            // 20 Strike Prices ka loop
            for(let i=1; i<=20; i++){
                let sp = 23000 + (i*50);
                document.write(`<tr>
                    <td class="itm-call val-oi-chg">${Math.floor(Math.random()*20000)}</td>
                    <td class="itm-call val-oi">${Math.floor(Math.random()*200000)}</td>
                    <td class="itm-call val-vol">${Math.floor(Math.random()*80000)}</td>
                    <td class="itm-call">${(Math.random()*200).toFixed(2)}</td>
                    <td class="strike-col">${sp}</td>
                    <td>${(Math.random()*200).toFixed(2)}</td>
                    <td class="val-vol">${Math.floor(Math.random()*80000)}</td>
                    <td class="val-oi">${Math.floor(Math.random()*200000)}</td>
                </tr>`);
            }
        </script>
    </table>

    <script>
        // Percentage Calculation logic (Calls Side & Put Side alag-alag)
        function calculatePercentages() {
            ['val-oi', 'val-vol', 'val-oi-chg'].forEach(cls => {
                let cells = document.querySelectorAll('.' + cls);
                let max = 0;
                cells.forEach(c => max = Math.max(max, parseInt(c.innerText)));
                cells.forEach(c => {
                    let pct = Math.round((parseInt(c.innerText) / max) * 100);
                    c.innerHTML += <span class="pct">${pct}%</span>;
                });
            });
        }
        window.onload = calculatePercentages;
    </script>
</body>
</html>
