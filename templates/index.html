<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Dashboard</title>
    <style>
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
        th, td { border: 1px solid #000; padding: 5px; }
        .header-main { background-color: #ddd; font-weight: bold; }
        .controls { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="switchMode('live')">Live</button>
        <button onclick="switchMode('historical')">Historical</button>
        <button onclick="toggleGreeks()">Toggle Greeks</button>
    </div>

    <table id="optionTable">
        <tr class="header-main">
            <th colspan="6">Call Side</th>
            <th>Strike Price</th>
            <th colspan="5">Put Side</th>
        </tr>
        <tr id="subHeader">
            <th>Theta</th><th>Gamma</th><th>D</th><th>OI</th><th>Volume</th><th>LTP</th>
            <th>Spot Price</th>
            <th>LTP</th><th>OI</th><th>Volume</th><th>OI Chg</th><th>P</th>
        </tr>
        <tbody id="dataBody">
            <!-- Random Data -->
            <tr>
                <td>0.05</td><td>0.12</td><td>0.55</td><td>15000</td><td>2000</td><td>120</td>
                <td>23300</td>
                <td>80</td><td>12000</td><td>1500</td><td>500</td><td>0.45</td>
            </tr>
        </tbody>
    </table>

    <script>
        function toggleGreeks() {
            alert("Greeks Hidden/Shown");
            // यहाँ आप CSS से columns को hide/show कर सकते हो
        }
        function switchMode(mode) {
            alert("Switched to: " + mode);
        }
    </script>
</body>
</html>
